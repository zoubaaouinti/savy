name: savy
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # ── Localisation (calendrier français) ──────────────────────
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.0.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  firebase_storage: ^12.1.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  pdf: ^3.10.8
  csv: ^6.0.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  printing: ^5.12.0
  intl: ^0.20.2
  http: ^1.2.0
  flutter_local_notifications: ^17.2.3
  onesignal_flutter: ^5.2.6
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0D2533"
  adaptive_icon_foreground: "assets/logo.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#0D2533"
    theme_color: "#3ECFCF"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/